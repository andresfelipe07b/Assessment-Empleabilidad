<app-navbar></app-navbar>
<app-loader *ngIf="loading"></app-loader>

<div class="container details-container" *ngIf="project && !loading">
    <div class="details-header card">
        <div class="header-top">
            <a routerLink="/dashboard" class="back-link">&larr; Back to Dashboard</a>
        </div>
        <div class="header-content">
            <h1>{{ project.name }}</h1>
            <div class="actions">
                <span class="status-badge" [class.active]="project.status === 'ACTIVE'">{{ project.status }}</span>
                <button *ngIf="project.status === 'DRAFT'" (click)="activateProject()"
                    class="btn btn-primary btn-activate" title="Activate Project">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                    <span class="btn-text">Activate Project</span>
                </button>
            </div>
        </div>
    </div>

    <div class="card tasks-section">
        <h3>Tasks</h3>

        <div class="input-group task-input">
            <input type="text" [(ngModel)]="newTaskTitle" placeholder="New Task Title" class="input-field"
                (keyup.enter)="addTask()">
            <button (click)="addTask()" class="btn btn-primary" [disabled]="!newTaskTitle">Add Task</button>
        </div>

        <div class="task-list">
            <div *ngFor="let task of tasks" class="task-item" [class.completed]="task.completed">
                <div class="task-info">
                    <input type="checkbox" [checked]="task.completed" (change)="completeTask(task)"
                        [disabled]="task.completed">
                    <span class="task-title">{{ task.title }}</span>
                </div>
                <div class="task-actions">
                    <span class="status-text">{{ task.completed ? 'Completed' : 'Pending' }}</span>
                    <button class="btn-icon btn-delete" (click)="deleteTask(task)" title="Delete Task">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2">
                            </path>
                            <line x1="10" y1="11" x2="10" y2="17"></line>
                            <line x1="14" y1="11" x2="14" y2="17"></line>
                        </svg>
                    </button>
                </div>
            </div>

        </div>
        <div *ngIf="tasks.length === 0" class="empty-state">No tasks yet.</div>
    </div>
</div>
