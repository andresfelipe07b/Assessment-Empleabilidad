<div class="login-container">
    <div class="card login-card">
        <h2 class="login-title">{{ isRegistering ? 'Create Account' : 'Welcome Back' }}</h2>

        <form (ngSubmit)="onSubmit()">
            <div class="form-group" *ngIf="isRegistering">
                <label class="label">Username</label>
                <input type="text" [(ngModel)]="username" name="username" class="input-field" required>
            </div>

            <div class="form-group">
                <label class="label">Email</label>
                <input type="email" [(ngModel)]="email" name="email" class="input-field" required>
            </div>

            <div class="form-group">
                <label class="label">Password</label>
                <input type="password" [(ngModel)]="password" name="password" class="input-field" required>
            </div>

            <div class="error-msg" *ngIf="error">{{ error }}</div>

            <button type="submit" class="btn btn-primary full-width">
                {{ isRegistering ? 'Sign Up' : 'Sign In' }}
            </button>
        </form>

        <div class="toggle-link" (click)="toggleMode()">
            {{ isRegistering ? 'Already have an account? Sign In' : 'Don\'t have an account? Sign Up' }}
        </div>
    </div>
</div>
